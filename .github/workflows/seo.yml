name: SEO and discovery checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed website
        run: node scripts/check-site.mjs
      - name: Audit SEO metadata and image accessibility
        if: always()
        run: node scripts/check-seo.mjs --json
      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit
          path: seo-audit.json
      - name: Verify discovery generator
        if: always()
        run: |
          node scripts/build-discovery.mjs
          node scripts/check-site.mjs
          node scripts/check-seo.mjs
  live-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed canonical URLs and crawler access
        run: node scripts/check-live-seo.mjs
      - name: Upload public live-site report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-audit
          path: live-seo-audit.json
          if-no-files-found: warn
          retention-days: 30
